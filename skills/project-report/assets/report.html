<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>@@TITLE@@</title>
<style>
:root{--ink:#202631;--sub:#556170;--dim:#738091;--border:#dbe1e8;--surf:#f5f7fa;--raised:#fff;--accent:#1479bd;--gain:#208254;--warn:#ac6318;--bad:#b43c36;--bg:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.75;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{max-width:1020px;margin:auto;padding:32px 36px 72px}main{min-width:0}h1{font-size:1.9rem;line-height:1.4;margin:18px 0 12px;letter-spacing:-.03em}h2{font-size:1.3rem;margin:42px 0 16px;border-bottom:1px solid var(--border);padding-bottom:9px;scroll-margin-top:20px}h3{font-size:1.08rem;margin:28px 0 12px;scroll-margin-top:20px}p{margin:0 0 14px}a{color:var(--accent);text-underline-offset:3px}img{max-width:100%;height:auto}li{margin:4px 0}code{font-family:Consolas,monospace;font-size:.88em;background:#e9edf3;padding:2px 5px;border-radius:4px;overflow-wrap:anywhere}pre{background:#18202d;color:#e6edf5;padding:20px;border-radius:9px;overflow:auto;line-height:1.65}pre code{padding:0;background:none;color:inherit;white-space:pre;overflow-wrap:normal}blockquote{margin:18px 0;padding:12px 18px;border-left:3px solid var(--border);color:var(--sub)}blockquote p:last-child{margin-bottom:0}hr{border:0;border-top:1px solid var(--border);margin:32px 0}
.topline{display:flex;justify-content:space-between;gap:16px;align-items:center;font-size:.8rem;color:var(--dim);letter-spacing:.06em}.download{border:1px solid var(--border);border-radius:6px;padding:5px 10px;text-decoration:none;background:white;white-space:nowrap}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;border:1px solid var(--border);border-radius:12px;background:var(--raised);margin:22px 0 28px;overflow:hidden}.metric{padding:20px 22px;border-right:1px solid var(--border);min-width:0}.metric-label{font-size:.82rem;color:var(--sub);margin-bottom:4px}.metric-value{font-size:1.85rem;line-height:1.35;font-weight:700;color:var(--accent);overflow-wrap:anywhere}.metric-note{font-size:.8rem;color:var(--dim);margin-top:6px}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px;margin:16px 0 24px;background:white}table{border-collapse:collapse;width:100%;font-size:.89rem}th{padding:10px 13px;background:#e9eff5;text-align:left;font-weight:600;white-space:nowrap}td{padding:9px 13px;border-top:1px solid var(--border);vertical-align:top}tbody tr:nth-child(even){background:#f8fafc}tbody tr:hover{background:#edf5fb}td,th{min-width:65px}td code{word-break:normal}
.callout{border-left:4px solid var(--accent);padding:14px 18px;border-radius:0 7px 7px 0;background:#eaf3fa;color:var(--ink)}.callout-tip{border-color:var(--gain);background:#edf6f0}.callout-warning{border-color:var(--warn);background:#fff5e9}.callout-caution{border-color:var(--bad);background:#fcedeb}.callout-important{border-color:var(--accent);background:#eaf3fa}
.chart{padding:22px 24px;margin:24px 0;background:white;border:1px solid var(--border);border-radius:12px;overflow:hidden}.chart figcaption{font-weight:650;font-size:1rem;margin-bottom:10px}.chart-meta{font-size:.78rem;color:var(--dim);margin-top:10px}.chart svg{display:block;width:100%;height:auto;min-width:620px}.chart-scroll{overflow:auto}.chart text{font-family:inherit;fill:var(--sub)}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.8rem;color:var(--sub);margin-bottom:8px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
nav{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-top:22px}nav summary{cursor:pointer;color:var(--sub);font-size:.85rem}nav ul{columns:2;padding-left:20px;margin:10px 0 0;font-size:.85rem}nav li{break-inside:avoid}footer{margin-top:52px;padding-top:18px;border-top:1px solid var(--border);font-size:.78rem;color:var(--dim);overflow-wrap:anywhere}
@media(max-width:640px){body{padding:20px 16px 48px}h1{font-size:1.55rem}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{padding:14px;border-bottom:1px solid var(--border)}.metric-value{font-size:1.5rem}.chart{padding:14px}nav ul{columns:1}.topline{font-size:.72rem}}
@media print{:root{background:#fff;font-size:11px}body{padding:0;max-width:none}.topline,nav{display:none}h2,h3{break-after:avoid}.metrics,.chart,blockquote{break-inside:avoid}.table-wrap{overflow:visible}thead{display:table-header-group}tr{break-inside:avoid}.chart svg{min-width:0}pre{white-space:pre-wrap}pre code{white-space:pre-wrap}a{color:inherit}.chart-scroll{overflow:visible}*{print-color-adjust:exact}}
</style>
</head>
<body>
<div class="topline"><span>PROJECT REPORT · 项目报告</span><a class="download" download="@@SOURCE_NAME@@" href="data:text/markdown;charset=utf-8;base64,@@SOURCE_B64@@">下载 MD 主稿</a></div>
<main>@@BODY@@</main>
@@TOC@@
<footer>由 @@SOURCE_NAME@@ 生成 · 主稿 SHA-256 @@SOURCE_HASH@@<br>编辑 Markdown 后重新生成 HTML，正文、表格与图表同步更新。</footer>
</body>
</html>
